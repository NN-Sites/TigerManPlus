name: Update latest video
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest video from RSS
        run: |
          ID=$(curl -sL "https://www.youtube.com/feeds/videos.xml?channel_id=UCM8QovN6fSGExubXBPXqPsw" | grep -o '<yt:videoId>[^<]*' | head -1 | sed 's/<yt:videoId>//')
          if [ -n "$ID" ]; then echo "{\"id\":\"$ID\"}" > latest.json; fi
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add latest.json
          git diff --cached --quiet || (git commit -m "Update latest video" && git push)
